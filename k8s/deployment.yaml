apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: student-attendance
          image: student-attendance-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_PATH
              value: /app/database/attendance.db
          # For a local/demo deployment, the SQLite file in the image/container is ephemeral.
          # Configure persistent storage before relying on attendance data in Kubernetes.
---
apiVersion: v1
kind: Service
metadata:
  name: student-attendance-service
spec:
  type: NodePort
  selector:
    app: student-attendance
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
